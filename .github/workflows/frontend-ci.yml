# Frontend CI
name: Frontend CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Node.js frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 3

      # TEMPORARY TEST ONLY: remove this step after validating the
      # unknown-failure triage route in debug-frontend.yml.
      # It runs only for a push that includes the marker in any pushed commit message.
      - name: Show unknown-failure test trigger context
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Marker found in pushed commits: ${{ contains(toJSON(github.event.commits), '[simulate-unknown-failure]') }}"

      - name: Inject controlled unknown failure
        if: ${{ github.event_name == 'push' && contains(toJSON(github.event.commits), '[simulate-unknown-failure]') }}
        shell: bash
        run: |
          set -euo pipefail
          echo "RECOVERY_TEST_SIGNAL=UNMAPPED_PIPELINE_STATE_7419"
          echo "Intentional test failure: exercising unknown-failure triage."
          exit 73
