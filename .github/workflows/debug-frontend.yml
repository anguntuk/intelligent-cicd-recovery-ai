
name: Frontend Failure Diagnostics

on:
  # Automatically trigger when Frontend CI completes
  # on a feature branch, regardless of its conclusion.
  workflow_run:
    workflows:
      - "Frontend CI"
    types:
      - completed
    branches:
      - 'feature/**'

  # Manually analyze a specific Frontend CI execution.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Frontend CI workflow run ID to analyze"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-diagnostics-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Frontend CI Result and Failure Diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read

    steps:

      # ==================================================
      # STEP 1: GATE - Identify and validate source run
      # ==================================================
      - name: Check frontend CI result
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}

        run: |
          set -euo pipefail

          echo "Checking target Frontend CI execution..."

          # Identify target run based on event type.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TARGET_RUN_ID="$EVENT_RUN_ID"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_RUN_ID="$INPUT_RUN_ID"
          else
            echo "::error::Unsupported diagnostic event."
            exit 1
          fi

          # Validate run ID.
          if [[ ! "$TARGET_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid or missing workflow run ID."
            exit 1
          fi

          echo "Target Run ID: $TARGET_RUN_ID"

          # Retrieve actual workflow run details.
          RUN_DATA=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}")

          WORKFLOW_NAME=$(jq -r '.name // ""' <<< "$RUN_DATA")
          BRANCH=$(jq -r '.head_branch // ""' <<< "$RUN_DATA")
          CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN_DATA")
          STATUS=$(jq -r '.status // ""' <<< "$RUN_DATA")
          SOURCE_SHA=$(jq -r '.head_sha // ""' <<< "$RUN_DATA")
          HEAD_REPOSITORY=$(jq -r '.head_repository.full_name // ""' <<< "$RUN_DATA")
          RUN_URL=$(jq -r '.html_url // ""' <<< "$RUN_DATA")

          echo "--------------------------------------"
          echo "Workflow       : $WORKFLOW_NAME"
          echo "Branch         : $BRANCH"
          echo "Status         : $STATUS"
          echo "Conclusion     : $CONCLUSION"
          echo "Source SHA     : $SOURCE_SHA"
          echo "Source Repo    : $HEAD_REPOSITORY"
          echo "--------------------------------------"

          # Validate workflow name.
          if [[ "$WORKFLOW_NAME" != "Frontend CI" ]]; then
            echo "::error::Expected Frontend CI workflow."
            exit 1
          fi

          # Reject external repository runs.
          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::Runs from external repositories are not allowed."
            exit 1
          fi

          # Validate source branch.
          # Supports feature/login and feature/ui/header.
          if [[ "$BRANCH" != feature/* ]]; then
            echo "::error::Only feature/* branches are allowed."
            exit 1
          fi

          # Validate source commit SHA.
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid source commit SHA."
            exit 1
          fi

          # Ensure the originating event and API identify
          # the same commit and branch.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then

            if [[ "$SOURCE_SHA" != "$EVENT_SOURCE_SHA" ]]; then
              echo "::error::Source SHA mismatch."
              echo "Event SHA: $EVENT_SOURCE_SHA"
              echo "API SHA:   $SOURCE_SHA"
              exit 1
            fi

            if [[ "$BRANCH" != "$EVENT_SOURCE_BRANCH" ]]; then
              echo "::error::Source branch mismatch."
              exit 1
            fi

          fi

          # Ensure source workflow has completed.
          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::Target workflow has not completed."
            exit 1
          fi

          # Set common outputs.
          echo "should_diagnose=false" >> "$GITHUB_OUTPUT"
          echo "run_id=$TARGET_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # ==========================================
          # DECISION 1: FRONTEND CI SUCCESS
          # ==========================================
          if [[ "$CONCLUSION" == "success" ]]; then

            echo "Frontend CI completed successfully."
            echo "No diagnostic analysis is required."

            {
              echo "## ✅ Frontend CI completed successfully"
              echo ""
              echo "No failures detected. Diagnostic analysis was not required."
              echo ""
              echo "- **Repository:** $REPOSITORY"
              echo "- **Branch:** $BRANCH"
              echo "- **Run ID:** [$TARGET_RUN_ID]($RUN_URL)"
              echo "- **Source SHA:** \`$SOURCE_SHA\`"
              echo "- **Diagnosis:** Not required"
              echo "- **Python controller:** Not invoked"
              echo "- **AI:** Disabled"
              echo "- **Recovery:** Not applicable"
            } >> "$GITHUB_STEP_SUMMARY"

          # ==========================================
          # DECISION 2: FRONTEND CI FAILURE
          # ==========================================
          elif [[ "$CONCLUSION" == "failure" ]]; then

            echo "should_diagnose=true" >> "$GITHUB_OUTPUT"

            echo "Frontend CI failure detected."
            echo "Starting diagnostic analysis."

            {
              echo "## ❌ Frontend CI failure detected"
              echo ""
              echo "Starting automated failure diagnosis."
              echo ""
              echo "- **Repository:** $REPOSITORY"
              echo "- **Branch:** $BRANCH"
              echo "- **Run ID:** [$TARGET_RUN_ID]($RUN_URL)"
              echo "- **Source SHA:** \`$SOURCE_SHA\`"
              echo "- **Diagnosis:** In progress"
              echo "- **AI:** Disabled"
              echo "- **Recovery:** Disabled"
            } >> "$GITHUB_STEP_SUMMARY"

          # ==========================================
          # DECISION 3: OTHER CONCLUSIONS
          # ==========================================
          else

            echo "Diagnosis not required."
            echo "Frontend CI conclusion: $CONCLUSION"

            {
              echo "## ℹ️ Diagnosis not required"
              echo ""
              echo "Frontend CI completed with conclusion: **$CONCLUSION**"
              echo ""
              echo "- **Branch:** $BRANCH"
              echo "- **Source SHA:** \`$SOURCE_SHA\`"
              echo "- **Diagnosis:** Not required"
            } >> "$GITHUB_STEP_SUMMARY"

          fi

      # ==================================================
      # STEP 2: CHECKOUT CONTROLLER FROM SOURCE COMMIT
      # ==================================================
      - name: Checkout diagnostic controller from source commit
        id: checkout-controller
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      # ==================================================
      # STEP 3: VERIFY CHECKED OUT COMMIT
      # ==================================================
      - name: Verify diagnostic controller commit
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.source_sha }}
        run: |
          set -euo pipefail

          ACTUAL_SHA=$(git rev-parse HEAD)

          echo "Expected source SHA: $EXPECTED_SHA"
          echo "Actual checkout SHA: $ACTUAL_SHA"

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Controller checkout does not match source CI commit."
            exit 1
          fi

          echo "Controller source commit verified successfully."

          {
            echo ""
            echo "### Controller source verification"
            echo ""
            echo "- **Expected SHA:** \`$EXPECTED_SHA\`"
            echo "- **Actual SHA:** \`$ACTUAL_SHA\`"
            echo "- **Verification:** Passed"
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================================================
      # STEP 4: SETUP PYTHON
      # ==================================================
      - name: Set up Python
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # ==================================================
      # STEP 5: INSTALL PYTHON CONTROLLER
      # ==================================================
      - name: Install Python dependencies
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install .

      # ==================================================
      # STEP 6: ANALYZE FRONTEND FAILURE
      # ==================================================
      - name: Analyze failed frontend workflow
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/reports"

          echo "Starting deterministic failure diagnosis..."

          python -m cicd_recovery.cli diagnose \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --require-feature-branch \
            --require-failure \
            --expected-workflow-name "Frontend CI" \
            --rules "$GITHUB_WORKSPACE/config/rules.yaml" \
            --output-dir "$GITHUB_WORKSPACE/reports"

      # ==================================================
      # STEP 7: UPLOAD DIAGNOSIS REPORT
      # ==================================================
      - name: Upload diagnosis report
        if: ${{ always() && steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-diagnosis-${{ steps.gate.outputs.run_id }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7
