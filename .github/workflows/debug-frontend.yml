name: Frontend Failure Diagnostics

# PRE-MERGE TEST MODE
# Runs from the feature branch so the workflow and controller can be
# verified before they are merged into the default branch.
on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-diagnostics-${{ github.sha }}
  cancel-in-progress: false

jobs:

  # ==================================================
  # JOB 1: WAIT FOR FRONTEND CI AND DIAGNOSE
  # ==================================================
  diagnose:
    name: Frontend CI Result and Failure Diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      approval_required: ${{ steps.approval.outputs.required }}
      supported_recipe: ${{ steps.approval.outputs.supported_recipe }}
      source_run_id: ${{ steps.gate.outputs.run_id }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      source_branch: ${{ steps.gate.outputs.source_branch }}
      controller_sha: ${{ steps.controller-revision.outputs.sha }}

    permissions:
      contents: read
      actions: read

    steps:

      # STEP 1: WAIT FOR THE FRONTEND CI RUN FOR THIS EXACT COMMIT
      - name: Wait for matching Frontend CI result
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSH_ACTOR: ${{ github.actor }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APP_BOT_LOGIN: ${{ vars.APP_BOT_LOGIN }}

        run: |
          set -euo pipefail

          echo "Repository: $REPOSITORY"
          echo "Feature branch: $PUSH_BRANCH"
          echo "Pushed commit: $PUSH_SHA"
          echo "Push actor: $PUSH_ACTOR"

          if [[ -z "$APP_BOT_LOGIN" ]]; then
            echo "::error::Repository variable APP_BOT_LOGIN is not configured."
            exit 1
          fi

          # The App-authenticated remediation commit must still trigger
          # Frontend CI, but must not recursively start another diagnosis.
          if [[ "$PUSH_ACTOR" == "$APP_BOT_LOGIN" \
            && "$PUSH_COMMIT_MESSAGE" == *"CI-Recovery-Automated: true"* ]]; then
            echo "should_diagnose=false" >> "$GITHUB_OUTPUT"
            echo "Automated remediation commit detected; skipping diagnosis for this push."
            {
              echo "## Automated remediation commit detected"
              echo ""
              echo "- Actor: $PUSH_ACTOR"
              echo "- Commit: \`$PUSH_SHA\`"
              echo "- Diagnostics: Skipped to prevent recursion"
              echo "- Frontend CI: Runs independently for this commit"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$PUSH_BRANCH" != feature/* ]]; then
            echo "::error::Only feature/* branches are allowed."
            exit 1
          fi

          if [[ ! "$PUSH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid pushed commit SHA."
            exit 1
          fi

          RUN_DATA=""

          # Frontend CI and this diagnostic workflow are triggered
          # by the same push. Wait until the matching CI run completes.
          for attempt in $(seq 1 180); do

            echo "Checking Frontend CI status (attempt $attempt/180)..."

            RUN_LIST=$(gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs" \
              -f branch="$PUSH_BRANCH" \
              -f event=push \
              -f head_sha="$PUSH_SHA" \
              -F per_page=100)

            MATCHING_RUN=$(jq -c \
              --arg sha "$PUSH_SHA" \
              --arg branch "$PUSH_BRANCH" '
                [
                  .workflow_runs[]?
                  | select(
                      .name == "Frontend CI"
                      and .head_sha == $sha
                      and .head_branch == $branch
                      and .event == "push"
                    )
                ]
                | sort_by(.created_at)
                | last // empty
              ' <<< "$RUN_LIST")

            if [[ -n "$MATCHING_RUN" ]]; then

              RUN_STATUS=$(jq -r '.status // ""' <<< "$MATCHING_RUN")

              echo "Matching Frontend CI run found."
              echo "Current status: $RUN_STATUS"

              if [[ "$RUN_STATUS" == "completed" ]]; then
                RUN_DATA="$MATCHING_RUN"
                break
              fi
            fi

            sleep 10
          done

          if [[ -z "$RUN_DATA" ]]; then
            echo "::error::Timed out waiting for Frontend CI to complete for commit $PUSH_SHA."
            exit 1
          fi

          WORKFLOW_NAME=$(jq -r '.name // ""' <<< "$RUN_DATA")
          BRANCH=$(jq -r '.head_branch // ""' <<< "$RUN_DATA")
          CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN_DATA")
          STATUS=$(jq -r '.status // ""' <<< "$RUN_DATA")
          SOURCE_SHA=$(jq -r '.head_sha // ""' <<< "$RUN_DATA")
          HEAD_REPOSITORY=$(jq -r '.head_repository.full_name // ""' <<< "$RUN_DATA")
          TARGET_RUN_ID=$(jq -r '.id // ""' <<< "$RUN_DATA")
          RUN_URL=$(jq -r '.html_url // ""' <<< "$RUN_DATA")

          echo "Workflow: $WORKFLOW_NAME"
          echo "Branch: $BRANCH"
          echo "Conclusion: $CONCLUSION"
          echo "Source SHA: $SOURCE_SHA"
          echo "Run ID: $TARGET_RUN_ID"

          if [[ "$WORKFLOW_NAME" != "Frontend CI" ]]; then
            echo "::error::Expected Frontend CI workflow."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::External repository runs are not allowed."
            exit 1
          fi

          if [[ "$BRANCH" != "$PUSH_BRANCH" ]]; then
            echo "::error::Frontend CI branch does not match the pushed branch."
            exit 1
          fi

          if [[ "$SOURCE_SHA" != "$PUSH_SHA" ]]; then
            echo "::error::Frontend CI SHA does not match the pushed commit."
            exit 1
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::Frontend CI has not completed."
            exit 1
          fi

          if [[ ! "$TARGET_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid Frontend CI run ID."
            exit 1
          fi

          echo "should_diagnose=false" >> "$GITHUB_OUTPUT"
          echo "run_id=$TARGET_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$CONCLUSION" == "failure" ]]; then

            echo "should_diagnose=true" >> "$GITHUB_OUTPUT"

            {
              echo "## Frontend CI failure detected"
              echo ""
              echo "- Repository: $REPOSITORY"
              echo "- Branch: $BRANCH"
              echo "- Run: [$TARGET_RUN_ID]($RUN_URL)"
              echo "- Source SHA: \`$SOURCE_SHA\`"
            } >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$CONCLUSION" == "success" ]]; then

            {
              echo "## Frontend CI completed successfully"
              echo ""
              echo "No diagnosis or remediation required."
            } >> "$GITHUB_STEP_SUMMARY"

          else

            echo "Diagnosis not required: $CONCLUSION"

            {
              echo "## Frontend CI result"
              echo ""
              echo "- Conclusion: $CONCLUSION"
              echo "- No remediation will be attempted."
            } >> "$GITHUB_STEP_SUMMARY"

          fi

      # STEP 2: CHECKOUT CONTROLLER FROM THE SAME FEATURE COMMIT
      - name: Checkout feature branch diagnostic controller
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Record trusted controller revision
        id: controller-revision
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        env:
          EXPECTED_CONTROLLER_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          SHA=$(git -C controller rev-parse HEAD)

          if [[ "$SHA" != "$EXPECTED_CONTROLLER_SHA" ]]; then
            echo "::error::Controller SHA does not match the pushed feature commit."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "Controller revision: $SHA"

      # STEP 3: SETUP PYTHON
      - name: Set up Python
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: controller/pyproject.toml

      # STEP 4: INSTALL CONTROLLER
      - name: Install Python dependencies
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install .

      # STEP 5: DIAGNOSE FAILURE
      - name: Analyze failed frontend workflow
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        working-directory: controller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}

        run: |
          set -euo pipefail

          mkdir -p reports

          python -m cicd_recovery.cli diagnose \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --require-feature-branch \
            --require-failure \
            --expected-workflow-name "Frontend CI" \
            --rules "$GITHUB_WORKSPACE/controller/config/rules.yaml" \
            --output-dir "$GITHUB_WORKSPACE/controller/reports"

      # STEP 6: EVALUATE APPROVAL AND SUPPORTED RECIPE
      - name: Evaluate human approval requirement
        id: approval
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t REPORTS < <(
            find controller/reports \
              -maxdepth 1 \
              -type f \
              -name '*.json' \
              -print
          )

          if [[ "${#REPORTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one diagnosis JSON report; found ${#REPORTS[@]}."
            exit 1
          fi

          REPORT="${REPORTS[0]}"

          APPROVAL_REQUIRED=$(jq -r '
            [
              .analyses[]?.diagnosis.remediation_plan?
              | select(
                  .decision == "approval_required"
                  and .eligible == true
                  and .requires_approval == true
                )
            ] | length > 0
          ' "$REPORT")

          SUPPORTED_RECIPE=$(jq -r '
            (.analyses // []) as $analyses
            | if ($analyses | length) != 1 then
                false
              else
                ($analyses[0].diagnosis // {}) as $d
                | ($d.remediation_plan // {}) as $p
                | (
                    $d.category == "unit_test_failure"
                    and (
                      ($d.matched_rule_ids // [])
                      | index("unit_test_failure") != null
                    )
                    and $p.decision == "approval_required"
                    and $p.eligible == true
                    and $p.requires_approval == true
                    and (
                      ($analyses[0].sanitized_log_excerpt // "") as $excerpt
                      | (
                          ($excerpt | contains("CI/CD Recovery Demo"))
                          and
                          ($excerpt | contains("CI/CD Recovery Dashboard"))
                        )
                    )
                  )
              end
          ' "$REPORT")

          EFFECTIVE_APPROVAL_REQUIRED="false"

          if [[ "$APPROVAL_REQUIRED" == "true" \
            && "$SUPPORTED_RECIPE" == "true" ]]; then
            EFFECTIVE_APPROVAL_REQUIRED="true"
          fi

          echo "Policy approval required: $APPROVAL_REQUIRED"
          echo "Supported recipe: $SUPPORTED_RECIPE"
          echo "Effective approval required: $EFFECTIVE_APPROVAL_REQUIRED"

          echo "required=$EFFECTIVE_APPROVAL_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "supported_recipe=$SUPPORTED_RECIPE" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## Remediation assessment"
            echo ""
            echo "- Policy approval required: $APPROVAL_REQUIRED"
            echo "- Supported recipe: $SUPPORTED_RECIPE"
            echo "- Effective approval required: $EFFECTIVE_APPROVAL_REQUIRED"
            echo "- Recipe: frontend_title_mismatch_v2"
            echo "- AI: Disabled"
          } >> "$GITHUB_STEP_SUMMARY"

      # STEP 7: UPLOAD DIAGNOSIS REPORT
      - name: Upload diagnosis report
        if: ${{ always() && steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-diagnosis-${{ steps.gate.outputs.run_id }}
          path: controller/reports/*.json
          if-no-files-found: error
          retention-days: 7


  # ==================================================
  # JOB 2: FIRST HUMAN APPROVAL
  # ==================================================
  remediation-approval:
    name: Human Approval for Remediation Proposal

    needs: diagnose

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.diagnose.outputs.approval_required == 'true'
        && needs.diagnose.outputs.supported_recipe == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    environment:
      name: remediation-approval

    steps:
      - name: Record approved remediation proposal
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Human approval received"
            echo ""
            echo "- Approval mechanism: GitHub Environment"
            echo "- Environment: remediation-approval"
            echo "- Reviewer approval: Granted"
            echo "- Remediation execution: Authorized"
            echo "- Recipe: frontend_title_mismatch_v2"
            echo "- Commit/push: Not performed"
            echo "- CI retry: Not performed"
          } >> "$GITHUB_STEP_SUMMARY"


  # ==================================================
  # JOB 3: APPROVED DETERMINISTIC REMEDIATION
  # ==================================================
  remediation-execution:
    name: Execute Approved Remediation and Validate

    needs:
      - diagnose
      - remediation-approval

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.remediation-approval.result == 'success'
        && needs.diagnose.outputs.supported_recipe == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:

      # STEP 1: DOWNLOAD DIAGNOSIS EVIDENCE
      - name: Download diagnosis report
        uses: actions/download-artifact@v8
        with:
          name: frontend-diagnosis-${{ needs.diagnose.outputs.source_run_id }}
          path: diagnosis

      # STEP 2: CHECKOUT TRUSTED CONTROLLER AT VERIFIED REVISION
      - name: Checkout diagnostic controller
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.diagnose.outputs.controller_sha }}
          path: controller
          fetch-depth: 1
          persist-credentials: false

      # STEP 3: CHECKOUT EXACT FAILED SOURCE COMMIT
      - name: Checkout originating feature source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.diagnose.outputs.source_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      # STEP 4: VERIFY REPORT AND SOURCE
      - name: Verify diagnosis and source revision
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.diagnose.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}

        run: |
          set -euo pipefail

          mapfile -t REPORTS < <(
            find diagnosis \
              -maxdepth 1 \
              -type f \
              -name '*.json' \
              -print
          )

          if [[ "${#REPORTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one diagnosis report; found ${#REPORTS[@]}."
            exit 1
          fi

          REPORT="${REPORTS[0]}"

          jq -e \
            --arg repo "$REPOSITORY" \
            --arg run "$SOURCE_RUN_ID" \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" '
              .repository == $repo
              and ((.workflow_run.id | tostring) == $run)
              and .workflow_run.head_sha == $sha
              and .workflow_run.head_branch == $branch
              and (.analyses | length) == 1
              and .analyses[0].diagnosis.category == "unit_test_failure"
              and (
                (.analyses[0].diagnosis.matched_rule_ids // [])
                | index("unit_test_failure") != null
              )
              and .analyses[0].diagnosis.remediation_plan.decision == "approval_required"
              and .analyses[0].diagnosis.remediation_plan.eligible == true
              and .analyses[0].diagnosis.remediation_plan.requires_approval == true
              and (
                (.analyses[0].sanitized_log_excerpt // "") as $excerpt
                | (
                    ($excerpt | contains("CI/CD Recovery Demo"))
                    and
                    ($excerpt | contains("CI/CD Recovery Dashboard"))
                  )
              )
            ' "$REPORT" > /dev/null

          ACTUAL_SHA=$(git -C source rev-parse HEAD)

          if [[ "$ACTUAL_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Checked-out source SHA does not match failed CI SHA."
            exit 1
          fi

          CONTROLLER_SHA=$(git -C controller rev-parse HEAD)

          if [[ "$CONTROLLER_SHA" != "${{ needs.diagnose.outputs.controller_sha }}" ]]; then
            echo "::error::Controller revision mismatch."
            exit 1
          fi

          echo "Diagnosis report verified."
          echo "Source branch: $SOURCE_BRANCH"
          echo "Source SHA: $SOURCE_SHA"
          echo "Controller SHA: $CONTROLLER_SHA"
          echo "Approved recipe: frontend_title_mismatch_v2"

      # STEP 5: SETUP PYTHON
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # STEP 6: INSTALL TRUSTED CONTROLLER
      - name: Install diagnostic controller
        working-directory: controller
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install .

      # STEP 7: SETUP NODE
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      # STEP 8: INSTALL FRONTEND DEPENDENCIES
      - name: Install frontend dependencies
        working-directory: source/frontend
        shell: bash
        run: |
          set -euo pipefail

          npm ci --ignore-scripts --no-audit --no-fund

            # STEP 9: EXECUTE REMEDIATION AND CREATE REVIEWABLE PATCH
      - name: Execute approved unit test remediation
        id: remediation
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.diagnose.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}
          CONTROLLER_SHA: ${{ needs.diagnose.outputs.controller_sha }}

        run: |
          set -euo pipefail

          echo "Executing approved deterministic remediation."
          echo "Recipe: frontend_title_mismatch_v2"
          echo "Source branch: $SOURCE_BRANCH"
          echo "Source SHA: $SOURCE_SHA"

          mkdir -p source/reports handoff

          mapfile -t REPORTS < <(
            find diagnosis \
              -maxdepth 1 \
              -type f \
              -name '*.json' \
              -print
          )

          if [[ "${#REPORTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one diagnosis report."
            exit 1
          fi

          REPORT="${REPORTS[0]}"

          set +e

          python -m cicd_recovery.remediation \
            --project-root "$GITHUB_WORKSPACE/source" \
            --approve \
            --diagnosis-report "$GITHUB_WORKSPACE/$REPORT" \
            --expected-source-sha "$SOURCE_SHA" \
            --expected-source-branch "$SOURCE_BRANCH" \
            > "$GITHUB_WORKSPACE/remediation-execution.log" 2>&1

          EXIT_CODE=$?

          set -e

          cat "$GITHUB_WORKSPACE/remediation-execution.log"

          mapfile -t AUDIT_FILES < <(
            find source/reports \
              -maxdepth 1 \
              -type f \
              -name 'remediation-frontend_title_mismatch_v2-*.json' \
              -print
          )

          if [[ "${#AUDIT_FILES[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one remediation audit report."
            exit 1
          fi

          AUDIT="${AUDIT_FILES[0]}"

          STATUS=$(jq -r '.status // "unknown"' "$AUDIT")

          if [[ "$EXIT_CODE" -ne 0 ]]; then
            echo "::error::Remediation execution failed with exit code $EXIT_CODE."
            exit "$EXIT_CODE"
          fi

          if [[ "$STATUS" != "validated_pending_commit_approval" ]]; then
            echo "::error::Unexpected remediation status: $STATUS"
            exit 1
          fi

          # Verify the audit before creating a commit handoff.
          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" '
              .schema_version == 2
              and .recipe_id == "frontend_title_mismatch_v2"
              and .status == "validated_pending_commit_approval"
              and .approval.received == true
              and .applicability.diagnosis.source_sha == $source_sha
              and .applicability.diagnosis.source_branch == $source_branch
              and (.changed_files | type) == "array"
              and (.changed_files | length) > 0
              and (.changed_files | length) == (.changed_files | unique | length)
              and all(
                .changed_files[];
                . == "frontend/src/index.html"
                or . == "frontend/test/app.test.js"
                or . == "frontend/test/known-issue-demo.test.js"
              )
              and (.validation | length) == 2
              and (
                .validation | map(.command)
              ) == ["npm test", "npm run build"]
              and (.validation | all(.passed == true))
              and .commit_performed == false
              and .push_performed == false
              and .ci_retry_triggered == false
              and (.after_sha256 | has("frontend/src/index.html"))
              and (.after_sha256 | has("frontend/test/app.test.js"))
              and (.after_sha256 | has("frontend/test/known-issue-demo.test.js"))
            ' "$AUDIT" > /dev/null

          mapfile -t CHANGED_FILES < <(
            jq -r '.changed_files[]' "$AUDIT"
          )

          mapfile -t DIFF_FILES < <(
            git -C source diff --name-only
          )

          if [[ "${#CHANGED_FILES[@]}" -eq 0 ]]; then
            echo "::error::No changed files to hand off. Refusing to create an empty commit."
            exit 1
          fi

          if [[ "${#DIFF_FILES[@]}" -eq 0 ]]; then
            echo "::error::Git did not detect the audited file changes."
            exit 1
          fi

          # Confirm that the audit and actual Git diff identify exactly
          # the same files.
          printf '%s\n' "${CHANGED_FILES[@]}" \
            | LC_ALL=C sort > handoff/audit-files.txt

          printf '%s\n' "${DIFF_FILES[@]}" \
            | LC_ALL=C sort > handoff/git-diff-files.txt

          if ! diff -u handoff/audit-files.txt handoff/git-diff-files.txt; then
            echo "::error::Audit changed_files does not match the actual Git diff."
            exit 1
          fi

          # Refuse unexpected untracked files in the source checkout.
          UNTRACKED_FILES=$(git -C source ls-files --others --exclude-standard)

          if [[ -n "$UNTRACKED_FILES" ]]; then
            echo "::error::Unexpected untracked files found in source checkout:"
            echo "$UNTRACKED_FILES"
            exit 1
          fi

          # Generate a binary-safe patch containing only audited files.
          git -C source diff \
            --binary \
            --no-ext-diff \
            -- "${CHANGED_FILES[@]}" \
            > handoff/remediation.patch

          if [[ ! -s handoff/remediation.patch ]]; then
            echo "::error::Generated remediation patch is empty."
            exit 1
          fi

          git -C source apply --stat \
            "$GITHUB_WORKSPACE/handoff/remediation.patch" \
            > handoff/patch-stat.txt

          # Copy the audit into the handoff bundle.
          cp "$AUDIT" handoff/audit.json

          PATCH_SHA256=$(sha256sum handoff/remediation.patch | awk '{print $1}')
          AUDIT_SHA256=$(sha256sum handoff/audit.json | awk '{print $1}')
          CHANGED_FILES_JSON=$(jq -c '.changed_files' "$AUDIT")

          # Create a manifest binding the patch and audit to this exact run.
          jq -n \
            --arg recipe_id "frontend_title_mismatch_v2" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg controller_sha "$CONTROLLER_SHA" \
            --arg patch_sha256 "$PATCH_SHA256" \
            --arg audit_sha256 "$AUDIT_SHA256" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson changed_files "$CHANGED_FILES_JSON" \
            '{
              schema_version: 1,
              recipe_id: $recipe_id,
              repository: $repository,
              source_run_id: $source_run_id,
              source_sha: $source_sha,
              source_branch: $source_branch,
              controller_sha: $controller_sha,
              generated_at: $generated_at,
              patch_file: "remediation.patch",
              patch_sha256: $patch_sha256,
              audit_file: "audit.json",
              audit_sha256: $audit_sha256,
              changed_files: $changed_files
            }' > handoff/manifest.json

          {
            echo ""
            echo "## Remediation execution result"
            echo ""
            echo "- Recipe: frontend_title_mismatch_v2"
            echo "- Result: $STATUS"
            echo "- Source branch: $SOURCE_BRANCH"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Changed files: ${#CHANGED_FILES[@]}"
            echo "- Patch SHA256: $PATCH_SHA256"
            echo "- Audit SHA256: $AUDIT_SHA256"
            echo "- Commit: Not performed"
            echo "- Push: Not performed"
            echo "- CI retry: Not performed"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Validated remediation patch and audit handoff created."


      # STEP 10: PRESERVE EXECUTION EVIDENCE
      - name: Upload remediation execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remediation-execution-evidence-${{ needs.diagnose.outputs.source_run_id }}
          path: |
            source/reports/*.json
            remediation-execution.log
          if-no-files-found: warn
          retention-days: 14


      # STEP 11: UPLOAD VALIDATED PATCH FOR REVIEW
      - name: Upload validated remediation handoff
        if: ${{ steps.remediation.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: validated-remediation-${{ needs.diagnose.outputs.source_run_id }}
          path: handoff/
          if-no-files-found: error
          retention-days: 14
  
    # ==================================================
  # JOB 4: REVIEW VALIDATED PATCH
  # ==================================================
  remediation-review:
    name: Review Validated Remediation Patch

    needs:
      - diagnose
      - remediation-execution

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.remediation-execution.result == 'success'
        && needs.diagnose.outputs.supported_recipe == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:

      - name: Download validated remediation handoff
        uses: actions/download-artifact@v8
        with:
          name: validated-remediation-${{ needs.diagnose.outputs.source_run_id }}
          path: review

      - name: Verify patch and audit evidence
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.diagnose.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}
          CONTROLLER_SHA: ${{ needs.diagnose.outputs.controller_sha }}

        run: |
          set -euo pipefail

          for FILE in manifest.json remediation.patch audit.json; do
            if [[ ! -s "review/$FILE" ]]; then
              echo "::error::Missing or empty handoff file: $FILE"
              exit 1
            fi
          done

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg controller_sha "$CONTROLLER_SHA" '
              .schema_version == 1
              and .recipe_id == "frontend_title_mismatch_v2"
              and .repository == $repository
              and .source_run_id == $run_id
              and .source_sha == $source_sha
              and .source_branch == $source_branch
              and .controller_sha == $controller_sha
              and .patch_file == "remediation.patch"
              and .audit_file == "audit.json"
              and (.changed_files | type) == "array"
              and (.changed_files | length) > 0
            ' review/manifest.json > /dev/null

          EXPECTED_PATCH_SHA=$(jq -r '.patch_sha256' review/manifest.json)
          EXPECTED_AUDIT_SHA=$(jq -r '.audit_sha256' review/manifest.json)

          ACTUAL_PATCH_SHA=$(sha256sum review/remediation.patch | awk '{print $1}')
          ACTUAL_AUDIT_SHA=$(sha256sum review/audit.json | awk '{print $1}')

          if [[ "$ACTUAL_PATCH_SHA" != "$EXPECTED_PATCH_SHA" ]]; then
            echo "::error::Remediation patch SHA256 mismatch."
            exit 1
          fi

          if [[ "$ACTUAL_AUDIT_SHA" != "$EXPECTED_AUDIT_SHA" ]]; then
            echo "::error::Remediation audit SHA256 mismatch."
            exit 1
          fi

          MANIFEST_FILES=$(jq -c '.changed_files' review/manifest.json)

          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --argjson manifest_files "$MANIFEST_FILES" '
              .schema_version == 2
              and .recipe_id == "frontend_title_mismatch_v2"
              and .status == "validated_pending_commit_approval"
              and .approval.received == true
              and .applicability.diagnosis.source_sha == $source_sha
              and .applicability.diagnosis.source_branch == $source_branch
              and .changed_files == $manifest_files
              and (.validation | length) == 2
              and (
                .validation | map(.command)
              ) == ["npm test", "npm run build"]
              and (.validation | all(.passed == true))
              and .commit_performed == false
              and .push_performed == false
              and .ci_retry_triggered == false
              and all(
                .changed_files[];
                . == "frontend/src/index.html"
                or . == "frontend/test/app.test.js"
                or . == "frontend/test/known-issue-demo.test.js"
              )
            ' review/audit.json > /dev/null

          git apply --stat review/remediation.patch \
            | tee review/patch-stat.txt

          echo "Patch and audit evidence verified."

          {
            echo "## Validated remediation patch — ready for review"
            echo ""
            echo "- Recipe: frontend_title_mismatch_v2"
            echo "- Source branch: $SOURCE_BRANCH"
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Source workflow run: $SOURCE_RUN_ID"
            echo "- Controller SHA: \`$CONTROLLER_SHA\`"
            echo "- Patch SHA256: \`$ACTUAL_PATCH_SHA\`"
            echo "- Audit SHA256: \`$ACTUAL_AUDIT_SHA\`"
            echo ""
            echo "### Files proposed for change"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r FILE; do
            echo "- \`$FILE\`" >> "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.changed_files[]' review/manifest.json)

          {
            echo ""
            echo "### Validation results"
            echo ""
            echo "| Command | Passed |"
            echo "|---|---|"
            echo "| npm test | Yes |"
            echo "| npm run build | Yes |"
            echo ""
            echo "### Actual proposed patch"
            echo ""
            echo '```diff'
            cat review/remediation.patch
            echo '```'
            echo ""
            echo "### Approval boundary"
            echo ""
            echo "No commit or push has been performed."
            echo "A second human approval is required before the commit job can run."
          } >> "$GITHUB_STEP_SUMMARY"

    # ==================================================
  # JOB 5: SECOND HUMAN APPROVAL FOR COMMIT
  # ==================================================
  commit-approval:
    name: Second Human Approval - Commit Validated Remediation

    needs:
      - diagnose
      - remediation-review

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.remediation-review.result == 'success'
        && needs.diagnose.outputs.supported_recipe == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    environment:
      name: remediation-commit-approval

    steps:

      - name: Record second approval
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Second human approval received"
            echo ""
            echo "- Approval mechanism: GitHub Environment"
            echo "- Environment: remediation-commit-approval"
            echo "- Patch review job: Successful"
            echo "- Validated patch: Approved for commit"
            echo "- Target: Originating feature branch"
            echo "- Force push: Not allowed"
            echo "- CI retry API: Not used"
          } >> "$GITHUB_STEP_SUMMARY"

    # ==================================================
  # JOB 6: COMMIT AND PUSH AFTER SECOND APPROVAL
  # ==================================================
  commit-push:
    name: Commit Approved Remediation and Verify Post-Push CI

    needs:
      - diagnose
      - remediation-review
      - commit-approval

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.remediation-review.result == 'success'
        && needs.commit-approval.result == 'success'
        && needs.diagnose.outputs.supported_recipe == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 55

    # GITHUB_TOKEN remains read-only. The narrowly scoped GitHub App token
    # is generated only after the second approval and only inside this job.
    permissions:
      contents: read
      actions: read

    steps:

      # STEP 1: DOWNLOAD THE EXACT PATCH THAT WAS REVIEWED
      - name: Download approved remediation handoff
        uses: actions/download-artifact@v8
        with:
          name: validated-remediation-${{ needs.diagnose.outputs.source_run_id }}
          path: review

      # STEP 2: CREATE A SHORT-LIVED, REPOSITORY-SCOPED GITHUB APP TOKEN
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-actions: read

      # STEP 3: CHECKOUT THE ORIGINATING FEATURE BRANCH USING THE APP TOKEN
      - name: Checkout originating feature branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.diagnose.outputs.source_branch }}
          path: source
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      # STEP 4: VERIFY BASE SHA, MANIFEST, AUDIT AND PATCH
      - name: Verify approved patch and source revision
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.diagnose.outputs.source_sha }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}
          CONTROLLER_SHA: ${{ needs.diagnose.outputs.controller_sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_BOT_LOGIN: ${{ vars.APP_BOT_LOGIN }}

        run: |
          set -euo pipefail

          if [[ "$SOURCE_BRANCH" != feature/* ]]; then
            echo "::error::Commit is restricted to feature/* branches."
            exit 1
          fi

          if [[ -z "$APP_SLUG" || "$APP_BOT_LOGIN" != "${APP_SLUG}[bot]" ]]; then
            echo "::error::APP_BOT_LOGIN must exactly match the installed GitHub App bot login: ${APP_SLUG}[bot]"
            exit 1
          fi

          for FILE in manifest.json remediation.patch audit.json; do
            if [[ ! -s "review/$FILE" ]]; then
              echo "::error::Missing approved handoff file: $FILE"
              exit 1
            fi
          done

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg controller_sha "$CONTROLLER_SHA" '
              .schema_version == 1
              and .recipe_id == "frontend_title_mismatch_v2"
              and .repository == $repository
              and .source_run_id == $run_id
              and .source_sha == $source_sha
              and .source_branch == $source_branch
              and .controller_sha == $controller_sha
              and .patch_file == "remediation.patch"
              and .audit_file == "audit.json"
              and (.changed_files | type) == "array"
              and (.changed_files | length) > 0
            ' review/manifest.json > /dev/null

          EXPECTED_PATCH_SHA=$(jq -r '.patch_sha256' review/manifest.json)
          EXPECTED_AUDIT_SHA=$(jq -r '.audit_sha256' review/manifest.json)

          ACTUAL_PATCH_SHA=$(sha256sum review/remediation.patch | awk '{print $1}')
          ACTUAL_AUDIT_SHA=$(sha256sum review/audit.json | awk '{print $1}')

          if [[ "$ACTUAL_PATCH_SHA" != "$EXPECTED_PATCH_SHA" ]]; then
            echo "::error::Approved patch SHA256 mismatch."
            exit 1
          fi

          if [[ "$ACTUAL_AUDIT_SHA" != "$EXPECTED_AUDIT_SHA" ]]; then
            echo "::error::Approved audit SHA256 mismatch."
            exit 1
          fi

          MANIFEST_FILES=$(jq -c '.changed_files' review/manifest.json)

          jq -e \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_branch "$SOURCE_BRANCH" \
            --argjson manifest_files "$MANIFEST_FILES" '
              .schema_version == 2
              and .recipe_id == "frontend_title_mismatch_v2"
              and .status == "validated_pending_commit_approval"
              and .approval.received == true
              and .applicability.diagnosis.source_sha == $source_sha
              and .applicability.diagnosis.source_branch == $source_branch
              and .changed_files == $manifest_files
              and (.validation | length) == 2
              and (.validation | map(.command)) == ["npm test", "npm run build"]
              and (.validation | all(.passed == true))
              and .commit_performed == false
              and .push_performed == false
              and .ci_retry_triggered == false
              and all(
                .changed_files[];
                . == "frontend/src/index.html"
                or . == "frontend/test/app.test.js"
                or . == "frontend/test/known-issue-demo.test.js"
              )
            ' review/audit.json > /dev/null

          # Fail closed if the source branch changed after diagnosis.
          ACTUAL_SOURCE_SHA=$(git -C source rev-parse HEAD)

          if [[ "$ACTUAL_SOURCE_SHA" != "$SOURCE_SHA" ]]; then
            echo "::error::Feature branch has advanced since diagnosis."
            echo "Expected: $SOURCE_SHA"
            echo "Actual:   $ACTUAL_SOURCE_SHA"
            echo "A fresh diagnosis and approval are required."
            exit 1
          fi

          if [[ -n "$(git -C source status --porcelain)" ]]; then
            echo "::error::Feature branch checkout is not clean."
            exit 1
          fi

          echo "Source revision and approved handoff verified."
          echo "GitHub App: $APP_SLUG"

      # STEP 5: APPLY ONLY THE REVIEWED PATCH
      - name: Apply and verify approved patch
        shell: bash
        run: |
          set -euo pipefail

          git -C source apply --check \
            "$GITHUB_WORKSPACE/review/remediation.patch"

          git -C source apply \
            "$GITHUB_WORKSPACE/review/remediation.patch"

          mapfile -t EXPECTED_FILES < <(
            jq -r '.changed_files[]' review/manifest.json
          )

          mapfile -t ACTUAL_FILES < <(
            git -C source diff --name-only
          )

          printf '%s\n' "${EXPECTED_FILES[@]}" \
            | LC_ALL=C sort > review/expected-files.txt

          printf '%s\n' "${ACTUAL_FILES[@]}" \
            | LC_ALL=C sort > review/actual-files.txt

          if ! diff -u review/expected-files.txt review/actual-files.txt; then
            echo "::error::Applied patch changed unexpected files."
            exit 1
          fi

          for FILE in \
            frontend/src/index.html \
            frontend/test/app.test.js \
            frontend/test/known-issue-demo.test.js
          do
            EXPECTED_SHA=$(jq -r \
              --arg file "$FILE" \
              '.after_sha256[$file] // empty' \
              review/audit.json)

            if [[ -z "$EXPECTED_SHA" ]]; then
              echo "::error::Missing audited after_sha256 for $FILE"
              exit 1
            fi

            ACTUAL_SHA=$(sha256sum "source/$FILE" | awk '{print $1}')

            if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
              echo "::error::Post-apply file hash mismatch: $FILE"
              exit 1
            fi
          done

          git -C source diff --check
          echo "Patch applied. All resulting file hashes match the validated audit."

      # STEP 6: STAGE ONLY THE AUDITED FILES
      - name: Stage approved files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED_FILES < <(
            jq -r '.changed_files[]' review/manifest.json
          )

          git -C source add -- "${CHANGED_FILES[@]}"

          mapfile -t STAGED_FILES < <(
            git -C source diff --cached --name-only
          )

          printf '%s\n' "${CHANGED_FILES[@]}" \
            | LC_ALL=C sort > review/expected-staged-files.txt

          printf '%s\n' "${STAGED_FILES[@]}" \
            | LC_ALL=C sort > review/actual-staged-files.txt

          if ! diff -u \
            review/expected-staged-files.txt \
            review/actual-staged-files.txt; then
            echo "::error::Staged files do not match the approved file list."
            exit 1
          fi

          if git -C source diff --cached --quiet; then
            echo "::error::No changes available to commit."
            exit 1
          fi

          echo "Only audited and approved files are staged."

      # STEP 7: COMMIT AND PUSH USING THE GITHUB APP TOKEN
      - name: Commit and push approved remediation
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.diagnose.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}

        run: |
          set -euo pipefail

          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')

          git -C source config user.name "${APP_SLUG}[bot]"
          git -C source config user.email \
            "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # The marker is consumed by the diagnostics workflow's gate.
          # It does not contain a GitHub CI-skip directive, so Frontend CI
          # still runs for this App-authenticated push.
          git -C source -c commit.cleanup=verbatim commit \
            -m "Apply approved CI remediation (run ${SOURCE_RUN_ID})" \
            -m "CI-Recovery-Automated: true"

          COMMIT_SHA=$(git -C source rev-parse HEAD)

          echo "Created commit: $COMMIT_SHA"
          echo "Pushing to: $SOURCE_BRANCH"

          set +e
          git -C source push origin "HEAD:${SOURCE_BRANCH}"
          PUSH_EXIT_CODE=$?
          set -e

          if [[ "$PUSH_EXIT_CODE" -eq 0 ]]; then
            PUSH_STATUS="pushed"
            PUSHED=true
          else
            PUSH_STATUS="push_rejected"
            PUSHED=false
          fi

          jq -n \
            --arg status "$PUSH_STATUS" \
            --arg recipe_id "frontend_title_mismatch_v2" \
            --arg source_branch "$SOURCE_BRANCH" \
            --arg source_sha "$SOURCE_SHA" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg app_slug "$APP_SLUG" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson commit_created true \
            --argjson pushed "$PUSHED" \
            '{
              schema_version: 2,
              status: $status,
              recipe_id: $recipe_id,
              source_run_id: $source_run_id,
              source_branch: $source_branch,
              source_sha: $source_sha,
              commit_sha: $commit_sha,
              commit_created: $commit_created,
              pushed: $pushed,
              pushed_by_app: $app_slug,
              post_push_ci: {
                status: (if $pushed then "pending" else "not_started" end),
                run_id: null,
                conclusion: null,
                url: null
              },
              ci_retry_triggered: false,
              created_at: $created_at
            }' > "$GITHUB_WORKSPACE/commit-result.json"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "pushed=$PUSHED" >> "$GITHUB_OUTPUT"

          if [[ "$PUSH_EXIT_CODE" -ne 0 ]]; then
            echo "::error::Commit was created locally, but GitHub rejected the push."
            echo "Check branch protection rules and GitHub App permissions."
            exit 1
          fi

          {
            echo ""
            echo "## Approved remediation committed and pushed"
            echo ""
            echo "- Recipe: frontend_title_mismatch_v2"
            echo "- Branch: $SOURCE_BRANCH"
            echo "- Original SHA: \`$SOURCE_SHA\`"
            echo "- New commit: \`$COMMIT_SHA\`"
            echo "- Commit: Completed"
            echo "- Push: Completed using GitHub App: $APP_SLUG"
            echo "- Post-push Frontend CI: Waiting"
          } >> "$GITHUB_STEP_SUMMARY"

      # STEP 8: WAIT FOR FRONTEND CI FOR THE EXACT REMEDIATION COMMIT
      - name: Wait for post-remediation Frontend CI
        id: post-push-ci
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ needs.diagnose.outputs.source_branch }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          SOURCE_RUN_ID: ${{ needs.diagnose.outputs.source_run_id }}

        run: |
          set -euo pipefail

          RUN_DATA=""

          # The App token triggers the push workflows. Poll for the
          # Frontend CI run whose head SHA is exactly our new commit.
          for attempt in $(seq 1 180); do
            echo "Waiting for Frontend CI (attempt $attempt/180)..."

            if ! RUN_LIST=$(gh api \
              --method GET \
              "repos/${REPOSITORY}/actions/runs" \
              -f branch="$SOURCE_BRANCH" \
              -f event=push \
              -f head_sha="$COMMIT_SHA" \
              -F per_page=100); then
              jq '.post_push_ci = {status: "api_error", run_id: null, conclusion: null, url: null} | .status = "pushed_ci_api_error"' \
                commit-result.json > commit-result.tmp
              mv commit-result.tmp commit-result.json
              echo "::error::Could not query GitHub Actions runs using the GitHub App token."
              exit 1
            fi

            MATCHING_RUN=$(jq -c \
              --arg sha "$COMMIT_SHA" \
              --arg branch "$SOURCE_BRANCH" \
              --arg repo "$REPOSITORY" '
                [
                  .workflow_runs[]?
                  | select(
                      .name == "Frontend CI"
                      and .head_sha == $sha
                      and .head_branch == $branch
                      and .event == "push"
                      and .head_repository.full_name == $repo
                    )
                ]
                | sort_by(.created_at)
                | last // empty
              ' <<< "$RUN_LIST")

            if [[ -n "$MATCHING_RUN" ]]; then
              RUN_STATUS=$(jq -r '.status // ""' <<< "$MATCHING_RUN")
              RUN_ID=$(jq -r '.id // ""' <<< "$MATCHING_RUN")
              RUN_URL=$(jq -r '.html_url // ""' <<< "$MATCHING_RUN")

              echo "Matching Frontend CI run: $RUN_ID ($RUN_STATUS)"

              if [[ "$RUN_STATUS" == "completed" ]]; then
                RUN_DATA="$MATCHING_RUN"
                break
              fi
            fi

            sleep 10
          done

          if [[ -z "$RUN_DATA" ]]; then
            jq '.post_push_ci = {status: "not_found_timeout", run_id: null, conclusion: null, url: null} | .status = "pushed_ci_not_found"' \
              commit-result.json > commit-result.tmp
            mv commit-result.tmp commit-result.json

            {
              echo ""
              echo "## Post-push Frontend CI verification timed out"
              echo ""
              echo "- Commit: \`$COMMIT_SHA\`"
              echo "- Branch: $SOURCE_BRANCH"
              echo "- Waited: 30 minutes"
              echo "- Commit and push remain completed; CI outcome is unknown."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::No completed Frontend CI run found for remediation commit $COMMIT_SHA within 30 minutes."
            exit 1
          fi

          CI_RUN_ID=$(jq -r '.id | tostring' <<< "$RUN_DATA")
          CI_CONCLUSION=$(jq -r '.conclusion // "unknown"' <<< "$RUN_DATA")
          CI_URL=$(jq -r '.html_url // ""' <<< "$RUN_DATA")
          CI_STATUS=$(jq -r '.status // "unknown"' <<< "$RUN_DATA")

          if [[ "$CI_CONCLUSION" == "success" ]]; then
            FINAL_STATUS="pushed_ci_success"
          else
            FINAL_STATUS="pushed_ci_failure"
          fi

          jq \
            --arg final_status "$FINAL_STATUS" \
            --arg ci_status "$CI_STATUS" \
            --arg ci_run_id "$CI_RUN_ID" \
            --arg ci_conclusion "$CI_CONCLUSION" \
            --arg ci_url "$CI_URL" \
            '.status = $final_status
             | .post_push_ci = {
                 status: $ci_status,
                 run_id: $ci_run_id,
                 conclusion: $ci_conclusion,
                 url: $ci_url
               }' \
            commit-result.json > commit-result.tmp
          mv commit-result.tmp commit-result.json

          {
            echo ""
            echo "## Post-push Frontend CI result"
            echo ""
            echo "- Remediation commit: \`$COMMIT_SHA\`"
            echo "- CI run: [$CI_RUN_ID]($CI_URL)"
            echo "- Conclusion: $CI_CONCLUSION"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$CI_CONCLUSION" != "success" ]]; then
            echo "::error::Post-remediation Frontend CI completed with conclusion: $CI_CONCLUSION"
            echo "The remediation commit remains pushed. No automatic rollback or second remediation will be attempted."
            exit 1
          fi

          echo "Post-remediation Frontend CI passed."

      # STEP 9: PRESERVE COMMIT AND POST-PUSH CI RESULT
      - name: Upload commit and post-push CI result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remediation-commit-result-${{ needs.diagnose.outputs.source_run_id }}
          path: commit-result.json
          if-no-files-found: warn
          retention-days: 14
