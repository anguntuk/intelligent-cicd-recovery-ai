name: Frontend Failure Diagnostics

# Automatic: run after Frontend CI completes on feature/* branches.
# Manual: dispatch this workflow from the default branch and enter a failed run ID.
on:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - 'feature/*'
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Frontend CI workflow run ID to analyze
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-diagnostics-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Analyze failed frontend workflow
    # The workflow_run filter limits automatic events to feature/* branches.
    # Manual dispatch must be started from the repository's default branch.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       startsWith(github.event.workflow_run.head_branch, 'feature/')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted controller from default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python controller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Resolve target workflow run ID
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            target_run_id="$EVENT_RUN_ID"
          else
            target_run_id="$INPUT_RUN_ID"
          fi

          if [[ ! "$target_run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid or missing workflow run ID." >&2
            exit 2
          fi

          echo "run_id=$target_run_id" >> "$GITHUB_OUTPUT"

      - name: Diagnose failed feature-branch run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m cicd_recovery.cli diagnose \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --require-feature-branch \
            --require-failure \
            --expected-workflow-name "Frontend CI" \
            --rules "$GITHUB_WORKSPACE/config/rules.yaml" \
            --output-dir "$GITHUB_WORKSPACE/reports"

      - name: Upload sanitized diagnosis report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-diagnosis-${{ steps.target.outputs.run_id }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7