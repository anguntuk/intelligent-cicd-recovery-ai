
name: Frontend Failure Diagnostics

on:
  workflow_run:
    workflows:
      - "Frontend CI"
    types:
      - completed
    branches:
      - 'feature/**'

  workflow_dispatch:
    inputs:
      run_id:
        description: "Frontend CI workflow run ID to analyze"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-diagnostics-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:

  # ==================================================
  # JOB 1: DETERMINISTIC FAILURE DIAGNOSIS
  # ==================================================
  diagnose:
    name: Frontend CI Result and Failure Diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      approval_required: ${{ steps.approval.outputs.required }}

    permissions:
      contents: read
      actions: read

    steps:

      # STEP 1: IDENTIFY AND VALIDATE SOURCE RUN
      - name: Check frontend CI result
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_RUN_ID: ${{ inputs.run_id }}

        run: |
          set -euo pipefail

          echo "Checking target Frontend CI execution..."

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            TARGET_RUN_ID="$EVENT_RUN_ID"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_RUN_ID="$INPUT_RUN_ID"
          else
            echo "::error::Unsupported diagnostic event."
            exit 1
          fi

          if [[ ! "$TARGET_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid workflow run ID."
            exit 1
          fi

          RUN_DATA=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${TARGET_RUN_ID}")

          WORKFLOW_NAME=$(jq -r '.name // ""' <<< "$RUN_DATA")
          BRANCH=$(jq -r '.head_branch // ""' <<< "$RUN_DATA")
          CONCLUSION=$(jq -r '.conclusion // ""' <<< "$RUN_DATA")
          STATUS=$(jq -r '.status // ""' <<< "$RUN_DATA")
          SOURCE_SHA=$(jq -r '.head_sha // ""' <<< "$RUN_DATA")
          HEAD_REPOSITORY=$(jq -r '.head_repository.full_name // ""' <<< "$RUN_DATA")
          RUN_URL=$(jq -r '.html_url // ""' <<< "$RUN_DATA")

          echo "Workflow: $WORKFLOW_NAME"
          echo "Branch: $BRANCH"
          echo "Conclusion: $CONCLUSION"
          echo "Source SHA: $SOURCE_SHA"

          if [[ "$WORKFLOW_NAME" != "Frontend CI" ]]; then
            echo "::error::Expected Frontend CI workflow."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "::error::External repository runs are not allowed."
            exit 1
          fi

          if [[ "$BRANCH" != feature/* ]]; then
            echo "::error::Only feature/* branches are allowed."
            exit 1
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid source commit SHA."
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$SOURCE_SHA" != "$EVENT_SOURCE_SHA" ]]; then
              echo "::error::Source SHA mismatch."
              exit 1
            fi

            if [[ "$BRANCH" != "$EVENT_SOURCE_BRANCH" ]]; then
              echo "::error::Source branch mismatch."
              exit 1
            fi
          fi

          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::Source workflow has not completed."
            exit 1
          fi

          echo "should_diagnose=false" >> "$GITHUB_OUTPUT"
          echo "run_id=$TARGET_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$CONCLUSION" == "failure" ]]; then
            echo "should_diagnose=true" >> "$GITHUB_OUTPUT"

            {
              echo "## Frontend CI failure detected"
              echo ""
              echo "- Repository: $REPOSITORY"
              echo "- Branch: $BRANCH"
              echo "- Run: [$TARGET_RUN_ID]($RUN_URL)"
              echo "- Source SHA: \`$SOURCE_SHA\`"
              echo "- Diagnosis: Starting"
            } >> "$GITHUB_STEP_SUMMARY"

          elif [[ "$CONCLUSION" == "success" ]]; then
            {
              echo "## Frontend CI completed successfully"
              echo ""
              echo "No diagnosis required."
            } >> "$GITHUB_STEP_SUMMARY"

          else
            echo "Diagnosis not required: $CONCLUSION"
          fi

      # STEP 2: CHECKOUT TRUSTED CONTROLLER SOURCE
      # Do not execute controller code from the failed feature branch.
      - name: Checkout diagnostic controller
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # STEP 3: SETUP PYTHON
      - name: Set up Python
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # STEP 4: INSTALL CONTROLLER
      - name: Install Python dependencies
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .

      # STEP 5: DETERMINISTIC FAILURE ANALYSIS
      - name: Analyze failed frontend workflow
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}

        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/reports"

          echo "Starting deterministic failure diagnosis..."

          python -m cicd_recovery.cli diagnose \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --require-feature-branch \
            --require-failure \
            --expected-workflow-name "Frontend CI" \
            --rules "$GITHUB_WORKSPACE/config/rules.yaml" \
            --output-dir "$GITHUB_WORKSPACE/reports"

      # STEP 6: DETERMINE APPROVAL REQUIREMENT
      - name: Evaluate human approval requirement
        id: approval
        if: ${{ steps.gate.outputs.should_diagnose == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          REPORT=$(find reports -maxdepth 1 -name '*.json' -type f | head -n 1)

          if [[ -z "$REPORT" ]]; then
            echo "::error::Diagnosis report not found."
            exit 1
          fi

          echo "Reading diagnosis report: $REPORT"

          APPROVAL_REQUIRED=$(jq -r '
            [
              .analyses[]?
              | .diagnosis.remediation_plan?
              | select(
                  .decision == "approval_required"
                  and .eligible == true
                  and .requires_approval == true
                )
            ] | length > 0
          ' "$REPORT")

          echo "Approval required: $APPROVAL_REQUIRED"

          echo "required=$APPROVAL_REQUIRED" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "## Remediation approval assessment"
            echo ""
            if [[ "$APPROVAL_REQUIRED" == "true" ]]; then
              echo "<escape> </escape>Human approval is required."
            else
              echo "No human approval gate was triggered."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # STEP 7: UPLOAD DIAGNOSIS REPORT
      - name: Upload diagnosis report
        if: ${{ always() && steps.gate.outputs.should_diagnose == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-diagnosis-${{ steps.gate.outputs.run_id }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 7


  # ==================================================
  # JOB 2: HUMAN APPROVAL GATE
  # ==================================================
  remediation-approval:

    name: Human Approval for Remediation Proposal

    needs: diagnose

    if: >-
      ${{
        needs.diagnose.result == 'success'
        && needs.diagnose.outputs.approval_required == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    environment:
      name: remediation-approval

    steps:

      - name: Record approved remediation proposal
        shell: bash
        run: |
          set -euo pipefail

          echo "Human approval received."
          echo "Remediation execution remains disabled."

          {
            echo ""
            echo "## Human approval received"
            echo ""
            echo "- Approval mechanism: GitHub Environment"
            echo "- Environment: remediation-approval"
            echo "- Reviewer approval: Granted"
            echo "- Remediation execution: Disabled"
            echo "- Validation commands: Not executed"
            echo "- Source modifications: None"
            echo "- Commit/push: Not performed"
            echo ""
            echo "The proposal has been approved for the next implementation stage."
          } >> "$GITHUB_STEP_SUMMARY"
