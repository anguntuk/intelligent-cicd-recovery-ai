name: Frontend Failure Diagnostics

on:
  workflow_run:
    workflows:
      - "Frontend CI"
    types:
      - completed
    branches:
      - 'feature/**'

  workflow_dispatch:
    inputs:
      run_id:
        description: "Failed Frontend CI run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-diagnostics-${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: CI Result and Failure Diagnosis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      # 1. Report successful CI
      - name: Report successful frontend CI
        if: >-
          ${{
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success'
          }}
        run: |
          {
            echo "## ✅ Frontend CI completed successfully"
            echo ""
            echo "No failure detected."
            echo "Diagnostic analysis was not required."
            echo ""
            echo "- Diagnosis: Not required"
            echo "- Python controller: Not invoked"
            echo "- Recovery: Not applicable"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Frontend CI successful. Skipping diagnosis."

      # 2. Checkout diagnostic code only when needed
      - name: Checkout diagnostic code
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'failure'
            )
          }}
        uses: actions/checkout@v7

      # 3. Setup Python only when needed
      - name: Set up Python
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'failure'
            )
          }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Keep your existing dependency installation step here,
      # using the same condition as above.

      # 4. Execute diagnosis only when needed
      - name: Analyze frontend failure
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' ||
            (
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.conclusion == 'failure'
            )
          }}
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python -m cicd_recovery.cli diagnose \
            --repo "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --require-feature-branch \
            --require-failure \
            --expected-workflow-name "Frontend CI"